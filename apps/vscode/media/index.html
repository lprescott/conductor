<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' 'unsafe-eval' blob: data:; worker-src blob: data: 'self'; child-src blob: data: 'self'; style-src 'unsafe-inline'; img-src data: blob:; media-src * blob: data:; connect-src https: wss: blob: data:; font-src data: blob:;">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-editor-foreground, #d4d4d4);
      font-family: var(--vscode-font-family, system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }

    #root { display: flex; flex-direction: column; height: 100%; }

    /* ── Toolbar ─────────────────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-sideBar-background, #252526));
      border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-editorGroup-border, #3c3c3c));
      flex-shrink: 0;
      height: 36px;
      user-select: none;
    }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      line-height: 1.5;
      white-space: nowrap;
      transition: background 80ms;
      background: var(--vscode-button-secondaryBackground, #3a3d41);
      color: var(--vscode-button-secondaryForeground, #cccccc);
    }
    .tbtn:hover:not(:disabled) {
      background: var(--vscode-button-secondaryHoverBackground, #45494e);
    }
    .tbtn:disabled { opacity: 0.4; cursor: default; }

    #btn-play {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #ffffff);
    }
    #btn-play:hover:not(:disabled) {
      background: var(--vscode-button-hoverBackground, #1177bb);
    }

    #btn-stop.live {
      background: transparent;
      color: var(--vscode-errorForeground, #f48771);
      border-color: currentColor;
    }
    #btn-stop.live:hover:not(:disabled) {
      background: rgba(244, 135, 113, 0.1);
    }

    .sep {
      width: 1px;
      height: 18px;
      background: var(--vscode-panel-border, #3c3c3c);
      flex-shrink: 0;
      margin: 0 4px;
    }

    #pattern-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--vscode-foreground, #cccccc);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spacer { flex: 1; min-width: 0; }

    #hint {
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #8b949e);
    }

    /* ── Editor host ─────────────────────────────────────────────────────── */
    #editor-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    strudel-editor { display: none; }

    /* The sibling div the web component inserts after <strudel-editor> */
    #editor-wrap > strudel-editor + div {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--vscode-editor-background, #1e1e1e);
    }

    /* CodeMirror — force it to fill the host and adopt VS Code's editor font */
    .cm-editor {
      height: 100%;
      background: var(--vscode-editor-background, #1e1e1e) !important;
    }
    .cm-scroller {
      font-family: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, monospace) !important;
      font-size: var(--vscode-editor-font-size, 13px) !important;
      line-height: 1.55 !important;
    }
    .cm-gutters {
      background: var(--vscode-editorGutter-background, var(--vscode-editor-background, #1e1e1e)) !important;
      border-right: 1px solid var(--vscode-editorGroup-border, transparent) !important;
    }
    .cm-activeLineGutter, .cm-activeLine {
      background: var(--vscode-editor-lineHighlightBackground, transparent) !important;
    }
    .cm-cursor {
      border-left-color: var(--vscode-editorCursor-foreground, #aeafad) !important;
    }
    .cm-selectionBackground, ::selection {
      background: var(--vscode-editor-selectionBackground, #264f78) !important;
    }

    /* ── Loading splash ──────────────────────────────────────────────────── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--vscode-editor-background, #1e1e1e);
      z-index: 10;
      transition: opacity 250ms ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--vscode-panel-border, #3c3c3c);
      border-top-color: var(--vscode-progressBar-background, #4ec9b0);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label {
      font-size: 12px;
      color: var(--vscode-descriptionForeground, #8b949e);
    }

    /* ── Error bar (bottom) ──────────────────────────────────────────────── */
    #error-bar {
      display: none;
      padding: 6px 10px;
      background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
      border-top: 1px solid var(--vscode-inputValidation-errorBorder, #be1100);
      color: var(--vscode-errorForeground, #f48771);
      font-size: 11px;
      font-family: var(--vscode-editor-font-family, monospace);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 96px;
      overflow-y: auto;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="root">
  <div id="toolbar">
    <button id="btn-play" class="tbtn" title="Play (Cmd/Ctrl+Shift+Space)" disabled>&#x25BA; Play</button>
    <button id="btn-stop" class="tbtn" title="Stop" disabled>&#x25A0; Stop</button>
    <div class="sep"></div>
    <span id="pattern-name">&mdash;</span>
    <div class="spacer"></div>
    <span id="hint">Click Play to start audio</span>
  </div>
  <div id="editor-wrap">
    <strudel-editor id="se"></strudel-editor>
    <div id="loading">
      <div class="spinner"></div>
      <span class="loading-label">Loading Strudel&hellip;</span>
    </div>
  </div>
  <div id="error-bar"></div>
</div>

<script nonce="{{NONCE}}">
// Capture every AudioContext strudel creates so we can resume it on user gesture.
(function () {
  const Orig = window.AudioContext || window.webkitAudioContext;
  if (!Orig) { console.warn('[conductor] AudioContext not available'); return; }
  class Wrapped extends Orig {
    constructor(...args) {
      super(...args);
      window.__audioContexts = window.__audioContexts || [];
      window.__audioContexts.push(this);
      console.log('[conductor] AudioContext created, state:', this.state, 'sampleRate:', this.sampleRate);
      this.addEventListener('statechange', () => {
        console.log('[conductor] AudioContext state →', this.state);
      });
    }
  }
  window.AudioContext = Wrapped;
  if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
})();

// Surface every error/rejection so we can see what's wrong without devtools.
window.addEventListener('error', (e) => {
  console.error('[conductor] error:', e.message, e.filename + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('[conductor] unhandled rejection:', e.reason);
});

// Strudel logs eval errors via console.log with "[eval] error:" / "[cyclist] error:"
// prefixes. Intercept so the webview can show them without devtools.
(function () {
  const orig = console.log;
  console.log = function (...args) {
    const first = typeof args[0] === 'string' ? args[0] : '';
    if (first.includes('error:')) {
      window.dispatchEvent(new CustomEvent('strudel-eval-error', { detail: first }));
    }
    orig.apply(console, args);
  };
})();
</script>
<script nonce="{{NONCE}}" src="{{STRUDEL_URI}}"></script>
<script nonce="{{NONCE}}">
(function () {
  const vscode = acquireVsCodeApi()

  let editor = null
  let editorReady = false
  let isPlaying = false
  let pendingCode = null
  let pendingName = null

  const btnPlay       = document.getElementById('btn-play')
  const btnStop       = document.getElementById('btn-stop')
  const patternNameEl = document.getElementById('pattern-name')
  const errorBar      = document.getElementById('error-bar')
  const loading       = document.getElementById('loading')
  const hint          = document.getElementById('hint')

  function updateButtons() {
    btnPlay.disabled = !editorReady || isPlaying
    btnStop.disabled = !editorReady || !isPlaying
    btnStop.classList.toggle('live', isPlaying)
    hint.style.visibility = isPlaying ? 'hidden' : 'visible'
  }

  function showError(msg) {
    errorBar.textContent = msg
    errorBar.style.display = 'block'
  }

  function clearError() {
    errorBar.style.display = 'none'
  }

  // Synchronously kick every AudioContext to resume — must happen inside the
  // user-gesture call frame, so no awaits before resume() is invoked.
  function resumeAudio() {
    const ctxs = window.__audioContexts || []
    return Promise.all(ctxs.map((ctx) => {
      if (!ctx || ctx.state !== 'suspended') return Promise.resolve()
      console.log('[conductor] resuming AudioContext')
      return ctx.resume().catch((e) => console.error('[conductor] resume failed:', e))
    }))
  }

  async function doPlay() {
    if (!editor || isPlaying) return
    const resumed = resumeAudio()
    try {
      await editor.evaluate(true)
      await resumed
      // Second pass: strudel may have created a fresh context during evaluate.
      await resumeAudio()
      isPlaying = true
      clearError()
      updateButtons()
      vscode.postMessage({ type: 'state', playing: true })
    } catch (err) {
      const message = String(err && err.message ? err.message : err)
      console.error('[conductor] evaluate failed:', err)
      showError(message)
      vscode.postMessage({ type: 'error', message })
    }
  }

  async function doStop() {
    if (!editor || !isPlaying) return
    try {
      await editor.stop()
    } finally {
      isPlaying = false
      clearError()
      updateButtons()
      vscode.postMessage({ type: 'state', playing: false })
    }
  }

  btnPlay.addEventListener('click', doPlay)
  btnStop.addEventListener('click', doStop)

  window.addEventListener('strudel-eval-error', (e) => {
    showError(e.detail)
    vscode.postMessage({ type: 'error', message: e.detail })
  })

  // Replace Strudel's hard-coded theme variables with VS Code's, every time
  // Strudel re-injects them.
  function applyThemeOverride() {
    let style = document.getElementById('vscode-theme-override')
    if (!style) {
      style = document.createElement('style')
      style.id = 'vscode-theme-override'
      document.head.appendChild(style)
    }
    style.textContent = `
      :root {
        --background: var(--vscode-editor-background, #1e1e1e) !important;
        --foreground: var(--vscode-editor-foreground, #d4d4d4) !important;
        --caret: var(--vscode-editorCursor-foreground, #aeafad) !important;
        --selection: var(--vscode-editor-selectionBackground, #264f78) !important;
        --selectionMatch: var(--vscode-editor-selectionHighlightBackground, #add6ff26) !important;
        --lineBackground: transparent !important;
        --lineHighlight: var(--vscode-editor-lineHighlightBackground, #ffffff0a) !important;
        --gutterBackground: var(--vscode-editorGutter-background, var(--vscode-editor-background, #1e1e1e)) !important;
        --gutterForeground: var(--vscode-editorLineNumber-foreground, #858585) !important;
        --gutterBorder: transparent !important;
      }
    `
  }
  applyThemeOverride()
  // Re-apply whenever Strudel re-injects its theme block.
  new MutationObserver(() => {
    const theirs = document.getElementById('strudel-theme-vars')
    const ours = document.getElementById('vscode-theme-override')
    if (theirs && ours && theirs.compareDocumentPosition(ours) & Node.DOCUMENT_POSITION_PRECEDING) {
      document.head.appendChild(ours)
    }
  }).observe(document.head, { childList: true, subtree: true })

  function attachEditor() {
    const el = document.getElementById('se')
    if (!el || !el.editor) return false
    editor = el.editor
    editorReady = true
    loading.classList.add('hidden')
    setTimeout(() => { loading.style.display = 'none' }, 300)
    updateButtons()

    if (pendingCode != null) {
      editor.setCode(pendingCode)
      pendingCode = null
    }
    if (pendingName != null) {
      patternNameEl.textContent = pendingName
      pendingName = null
    }

    vscode.postMessage({ type: 'ready' })

    // Sync user edits in the codemirror back to the document.
    let lastCode = editor.code
    let timer = null
    setInterval(() => {
      if (!editor) return
      const code = editor.code
      if (code === lastCode) return
      lastCode = code
      clearTimeout(timer)
      timer = setTimeout(() => {
        vscode.postMessage({ type: 'code_changed', code })
      }, 600)
    }, 500)
    return true
  }

  // The web component upgrades asynchronously. Try immediately, then on `update`.
  document.getElementById('se').addEventListener('update', function once() {
    if (attachEditor()) this.removeEventListener('update', once)
  })
  // Belt-and-braces: poll briefly in case the `update` event has already fired.
  let attempts = 0
  const pollId = setInterval(() => {
    if (editorReady || attempts++ > 40) { clearInterval(pollId); return }
    attachEditor()
  }, 100)

  window.addEventListener('message', async function (event) {
    const msg = event.data
    if (!msg) return

    if (msg.type === 'pattern') {
      if (!editor) {
        pendingCode = msg.code
        pendingName = msg.name || pendingName
        return
      }
      editor.setCode(msg.code)
      if (msg.name) patternNameEl.textContent = msg.name
      if (isPlaying) {
        try {
          await editor.evaluate(true)
          clearError()
          vscode.postMessage({ type: 'cleared' })
        } catch (err) {
          const message = String(err && err.message ? err.message : err)
          showError(message)
          vscode.postMessage({ type: 'error', message })
        }
      }
    } else if (msg.type === 'play') {
      await doPlay()
    } else if (msg.type === 'stop') {
      await doStop()
    }
  })
})()
</script>
</body>
</html>
